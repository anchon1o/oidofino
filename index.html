<!doctype html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oído Fino</title>
<meta name="description" content="Oído Fino: adestramento auditivo progresivo (ritmo e melodía) para Linguaxe Musical.">
<meta name="theme-color" content="#24453A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oído Fino">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3E9E6;--ink:#1D2925;--muted:#55635D;--btn:#FFFFFF;--btn-ink:#1D2925;--line:#B8C3BD;
  --accent:#2E6B55;--accent-ink:#FFFFFF;
  --board:#24453A;--chalk:#F3F1E7;--chalk-y:#F6D75A;--chalk-b:#9BD0F0;--chalk-p:#F59AB0;--chalk-g:#A8E6A1;
  --wood:#9A6A3F;--wood-2:#7A5130;--key:#FBFAF5;--key-ink:#1D2925;--key-black:#1D2925;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#111715;--ink:#E7ECE9;--muted:#9BA9A3;--btn:#1C2622;--btn-ink:#E7ECE9;--line:#34433D;--accent:#F6D75A;--accent-ink:#1D2925;--key:#E9E7DD;--key-ink:#1D2925;--key-black:#0E1311;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#111715;--ink:#E7ECE9;--muted:#9BA9A3;--btn:#1C2622;--btn-ink:#E7ECE9;--line:#34433D;--accent:#F6D75A;--accent-ink:#1D2925;--key:#E9E7DD;--key-ink:#1D2925;--key-black:#0E1311;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:"Gochi Hand","Comic Sans MS",cursive;font-weight:400;font-size:clamp(32px,7vw,46px);margin:0;line-height:1}
button{font:inherit;color:var(--btn-ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.tabs .gear{margin-left:auto;font-family:inherit;font-size:22px}
.card{border:1px solid var(--line);background:var(--btn);border-radius:14px;padding:4px 14px 12px;margin-top:14px}
.card .ah{margin:12px 0 8px}
.pform{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px}
.pform label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.pform input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:160px}
.rhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.rank{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px;font-size:15px}
.rank li{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:8px}
.rank li:nth-child(odd){background:var(--bg)}
.rank li.me{outline:2px solid var(--accent)}
.rank .pos{font-family:"Gochi Hand",cursive;font-size:20px;width:1.6em;text-align:center}
.rank .nm{flex:1;font-weight:700}.rank .gr{color:var(--muted);font-size:13px;font-weight:400}
.rank .sc{color:var(--muted);font-size:13px;white-space:nowrap}
.locked .lk,.lk.locked{pointer-events:none;opacity:.45}
.pathbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;padding:10px 12px;border:2px solid var(--accent);border-radius:12px;background:var(--btn)}
.pathbar b{font-weight:700}.pathbar .dots{letter-spacing:3px;color:var(--accent)}.pathbar .spacer{flex:1}
.path{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.path li button{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--btn);border-radius:12px;padding:10px 12px}
.path li .n{font-family:"Gochi Hand",cursive;font-size:24px;width:1.6em;text-align:center}
.path li .lab{flex:1;font-size:15px}.path li .st{font-size:14px;color:var(--muted);white-space:nowrap}
.path li.done button{border-color:var(--accent)}.path li.done .st{color:var(--accent);font-weight:700}
.path li.cur button{border-width:2px;border-color:var(--accent);box-shadow:0 2px 0 var(--accent)}
.path li.lock button{opacity:.45;cursor:default}
.ah{font-size:17px;margin:20px 0 8px}
.alist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.alist li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--btn);border-radius:10px;padding:6px 8px;font-size:14px}
.alist li .lab{flex:1}.alist li.off{opacity:.5}
.alist button{border:1px solid var(--line);background:var(--bg);border-radius:6px;min-width:32px;min-height:32px}
.alist svg{height:40px;width:auto;background:var(--board);border-radius:6px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips svg{height:38px;width:auto;background:var(--board);border-radius:6px;border:3px solid var(--wood)}
.opts4{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 14px}
.opts4 button{background:transparent;border:2px solid rgba(243,241,231,.25);border-radius:10px;padding:6px;position:relative}
.opts4 button svg{width:100%;height:auto;display:block}
.opts4 button.ok{border-color:var(--chalk-g);background:rgba(168,230,161,.12)}.opts4 button.bad{border-color:var(--chalk-p);background:rgba(245,154,176,.12)}
.opts4 button.pl{border-color:var(--chalk-y)}
.opts4 .tag{position:absolute;top:4px;left:8px;font-family:"Gochi Hand",cursive;color:var(--chalk);opacity:.6;font-size:18px}
.nl{stroke:var(--chalk);stroke-width:2;opacity:.55}.nh,.nrest{fill:var(--chalk)}.nst{stroke:var(--chalk);stroke-width:1.9}
.nbm{stroke:var(--chalk);stroke-width:4.6}.nfl{stroke:var(--chalk);stroke-width:2.4;fill:none;stroke-linecap:round}
@media (max-width:560px){.opts4{grid-template-columns:1fr}}
.barplay{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:14px;color:var(--muted)}
.barplay button{border:1px solid var(--line);background:var(--btn);border-radius:999px;padding:5px 12px;font-size:14px}
.palette{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.palette button{background:var(--board);border:4px solid var(--wood);border-radius:10px;padding:2px 4px;cursor:pointer}
.palette button svg{height:52px;width:auto;display:block}
.palette button:disabled{opacity:.3;cursor:default}
.palette button:active:not(:disabled){transform:translateY(1px)}
.cg.bad .nh,.cg.bad .nrest{fill:var(--chalk-p)}.cg.bad .nst,.cg.bad .nbm,.cg.bad .nfl{stroke:var(--chalk-p)}
.cg.ok .nh,.cg.ok .nrest{fill:var(--chalk-g)}.cg.ok .nst,.cg.ok .nbm,.cg.ok .nfl{stroke:var(--chalk-g)}
.cg .hit{fill:transparent;cursor:pointer}.slotbox{cursor:pointer;pointer-events:all}.slotbox.cur{stroke:var(--chalk-y);stroke-opacity:1;stroke-dasharray:none;stroke-width:3;fill:rgba(246,215,90,.1)}.tsig{fill:var(--chalk);font:700 26px Georgia,"Times New Roman",serif;text-anchor:middle}.slotbox{fill:none;stroke:var(--chalk);stroke-opacity:.3;stroke-width:2;stroke-dasharray:5 5}
.lang{position:relative}
header .snd{margin-left:auto;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:4px}
header .snd select{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.lang .cur{border:1px solid var(--line);background:var(--btn);border-radius:8px;padding:7px;display:flex}
.lang .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--btn);border:1px solid var(--line);border-radius:10px;padding:6px;display:none;flex-direction:column;gap:4px;z-index:5}
.lang.open .menu{display:flex}
.lang .menu button{border:0;background:none;padding:6px;border-radius:6px;display:flex}
.flag{width:30px;height:20px;display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.tabs{display:flex;gap:4px;margin:16px 0 0;border-bottom:2px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 14px 10px;font-family:"Gochi Hand",cursive;font-size:26px;line-height:1;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--btn)}
.seg button{border:0;background:none;padding:7px 12px;font-size:15px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.levels{display:grid;gap:8px;margin:14px 0}
.levels.r{grid-template-columns:repeat(4,1fr)}
.levels.m{grid-template-columns:repeat(5,1fr)}
.levels button{border:1px solid var(--line);background:var(--btn);border-radius:10px;padding:8px 10px;text-align:left;line-height:1.2;font-size:15px}
.levels button b{display:block;font-family:"Gochi Hand",cursive;font-weight:400;font-size:24px}
.levels button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:4px 0 14px;font-size:15px;color:var(--muted)}
.opts label{display:flex;align-items:center;gap:8px}
.frame{background:var(--wood);padding:10px;border-radius:14px;box-shadow:inset 0 0 0 2px var(--wood-2),0 2px 0 var(--wood-2)}
.board{background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.06),transparent 60%),radial-gradient(ellipse at 80% 90%,rgba(255,255,255,.04),transparent 50%),var(--board);border-radius:6px}
.status{font-family:"Gochi Hand","Comic Sans MS",cursive;color:var(--chalk);opacity:.85;font-size:22px;padding:8px 14px 0;min-height:38px}
svg.sb{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.st{stroke:var(--chalk);stroke-width:9;stroke-linecap:round;fill:none}
.st.thin{stroke-width:8}
.beam{stroke:var(--chalk);stroke-width:14;stroke-linecap:round}
.rs .st{opacity:.38}
.scr{stroke:var(--chalk-b);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
.tie{stroke:var(--chalk-y);stroke-width:7;stroke-linecap:round;fill:none}
.num{fill:var(--chalk);opacity:.45;font-family:"Gochi Hand",cursive;font-size:22px;text-anchor:middle}
.hl{fill:var(--chalk);opacity:0}
.hl.on{opacity:.09}
.mk-ok{stroke:var(--chalk-g);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mk-bad{stroke:var(--chalk-p);stroke-width:5;fill:none;stroke-linecap:round}
.bad-st .st,.bad-st .beam{stroke:var(--chalk-p)}
.stem{stroke:var(--chalk);stroke-width:3}.fbeam{stroke:var(--chalk);stroke-width:8}.fhead,.restp{fill:var(--chalk)}
.fig.bad .fhead,.fig.bad .restp{fill:var(--chalk-p)}.fig.bad .stem,.fig.bad .fbeam{stroke:var(--chalk-p)}
.trail{stroke:var(--chalk);stroke-opacity:.35;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sl{stroke:var(--chalk);stroke-width:2.2;opacity:.75}
.clef{stroke:var(--chalk);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.clefdot{fill:var(--chalk)}
.head{fill:var(--chalk)}.hole{fill:var(--board)}
.ledger{stroke:var(--chalk);stroke-width:2.2}
.nt.ref .head{fill:var(--chalk-y)}.nt.ref .ledger{stroke:var(--chalk-y)}
.nt.ok .head{fill:var(--chalk-g)}.nt.bad .head{fill:var(--chalk-p)}
.nt.ghost{opacity:.55}
.slot{fill:var(--chalk);opacity:.35}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--btn);border-radius:10px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.big{font-size:19px;padding:12px 22px}
.btn:disabled{opacity:.5;cursor:default}
.tempo{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
.tempo input{width:120px;accent-color:var(--accent)}
.tempo output{min-width:2.5em;color:var(--ink);font-weight:700}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.spacer{flex:1}
.fb{margin:14px 0 0;font-weight:700;min-height:1.45em}
.fb.ok{color:var(--accent)}
.solbox{margin-top:12px}
.solbox h2{font-size:15px;color:var(--muted);margin:0 0 6px;font-weight:700}
.ver{margin:28px 0 0;text-align:center;font-size:13px;color:var(--muted)}.ver b{color:var(--ink)}
.hints{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:15px}
.hints li{display:flex;align-items:center;gap:8px}
.sw{width:22px;height:6px;border-radius:3px;background:var(--muted);flex:none}
.sw.b{background:#4C9BC9}.sw.y{background:#D9A915}.sw.w{background:var(--ink)}
.score{display:flex;gap:16px;margin-top:10px;color:var(--muted);font-size:15px}
.score b{color:var(--ink)}
.inp{margin-top:14px;transition:opacity .15s}
.inp.off{opacity:.4;pointer-events:none}
.nbtns{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.nbtns button{border:1px solid var(--line);background:var(--btn);border-radius:10px;padding:12px 0;font-weight:700;font-size:16px}
.nbtns button:disabled{opacity:.3;cursor:default}
.kb{position:relative;display:flex;height:96px;user-select:none;-webkit-user-select:none}
.kb .w{flex:1;border:1px solid var(--line);border-radius:0 0 8px 8px;background:var(--key);color:var(--key-ink);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:13px;font-weight:700}
.kb .w+.w{border-left:0}
.kb .w:disabled{color:rgba(29,41,37,.3);background:var(--key);opacity:1;cursor:default;filter:brightness(.85)}
.kb .w:active:not(:disabled){filter:brightness(.88)}
.kb .k{position:absolute;top:0;height:58%;background:var(--key-black);border:0;border-radius:0 0 5px 5px;padding:0 0 5px;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;z-index:1}
.kb .k:disabled{color:transparent;cursor:default}
.kb .k:not(:disabled){box-shadow:0 0 0 2px var(--accent)}
.curnav button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.lvrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin:14px 0}
.lvl{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:15px}
.lvl b{font-family:"Gochi Hand",cursive;font-weight:400;font-size:28px;color:var(--ink);width:1.2ch;text-align:center}.lvl b.dim{opacity:.35}
.lvl input{width:150px;accent-color:var(--accent)}
svg.scale{width:300px;max-width:100%;height:auto;background:var(--board);border-radius:8px;border:4px solid var(--wood)}
.sname{fill:var(--chalk);font-size:10px;text-anchor:middle;font-family:"Atkinson Hyperlegible",sans-serif}
.unused{opacity:.22}
.clefp{fill:var(--chalk)}
.acc{fill:var(--chalk)}.nt.ref .acc{fill:var(--chalk-y)}.nt.ok .acc{fill:var(--chalk-g)}.nt.bad .acc,.nt.ghost.no .acc{fill:var(--chalk-p)}.nt.ghost .acc{fill:var(--chalk-y)}
#scale{cursor:pointer;touch-action:manipulation}.scwrap{display:flex;flex-direction:column;gap:4px}.sccap{font-size:13px;color:var(--muted);min-height:1.45em}.sccap.on{color:var(--ink);font-weight:700}
.keyrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:14px 0 0}.klab{color:var(--muted);font-size:15px}
.keys{display:flex;flex-wrap:wrap;gap:6px 10px}.keys .kg{display:inline-flex;align-items:center;gap:4px}.keys .kg i{font-style:normal;font-size:13px;color:var(--muted);min-width:1.8em;text-align:right}
.kname{fill:var(--chalk-y);font:700 13px "Atkinson Hyperlegible",sans-serif}.keys button{border:1px solid var(--line);background:var(--btn);border-radius:999px;padding:5px 12px;font-size:15px}
.keys button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.keyrow .sccap{flex-basis:100%}
.lvl .cust{font-size:15px;color:var(--ink);font-weight:700}
.cursor{stroke:var(--chalk-y);stroke-width:4;stroke-linecap:round}
.colhl{fill:var(--chalk-y);opacity:.08}
.nt.ghost .head{fill:var(--chalk-y)}.nt.ghost{opacity:.7}.nt.ghost.no .head{fill:var(--chalk-p)}
#mstaff{cursor:crosshair}
.inrow{display:flex;align-items:stretch;gap:8px;max-width:520px}
.inrow .kb{flex:1}
.curnav{display:flex;flex-direction:column;gap:6px}
.curnav button{flex:1;border:1px solid var(--line);background:var(--btn);border-radius:8px;padding:0 12px;font-size:16px}
.mhint{color:var(--muted);font-size:14px;margin:8px 0 0}
@media (max-width:560px){.levels button{font-size:12px;padding:6px 8px}.levels button b{font-size:20px}.levels.r{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.inp{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i="app"></h1>
    <label class="snd">🔊 <select id="timbre"><option value="piano" data-i="tPiano"></option><option value="marimba" data-i="tMarimba"></option><option value="frauta" data-i="tFrauta"></option></select></label>
    <div class="lang" id="lang">
      <button class="cur" id="langCur" aria-haspopup="true" aria-label="Idioma"></button>
      <div class="menu" id="langMenu"></div>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-sec="p" data-i="secP"></button>
    <button data-sec="r" data-i="secR"></button>
    <button data-sec="m" data-i="secM"></button>
    <button data-sec="a" aria-label="Admin" class="gear" id="gearTab" hidden>⚙</button>
  </nav>
  <!-- ================= CAMIÑO ================= -->
  <section id="secP" hidden>
    <div class="card" id="profCard">
      <h2 class="ah" data-i="profile"></h2>
      <div class="pform">
        <label><span data-i="nick"></span><input id="pNick" maxlength="20" autocomplete="off"></label>
        <label><span data-i="grupo"></span><input id="pGrupo" maxlength="20" autocomplete="off" style="text-transform:uppercase"></label>
        <button class="btn primary" id="pSave"><span data-i="saveP"></span></button>
      </div>
      <p class="mhint" data-i="nickHint"></p>
      <p class="fb" id="pMsg"></p>
    </div>
    <div class="card">
      <div class="rhead"><h2 class="ah" data-i="ranking"></h2><div class="seg" id="rkScope"><button data-v="g" data-i="myGroup"></button><button data-v="all" data-i="all"></button></div></div>
      <ol class="rank" id="rkList"></ol>
    </div>
    <p class="mhint" id="pathIntro"></p>
    <ol class="path" id="pathList"></ol>
  </section>
  <!-- ================= ADMIN ================= -->
  <section id="secA" hidden>
    <p class="mhint" data-i="admNote"></p>
    <div class="card">
      <div class="pform">
        <label><span>PIN</span><input id="admPin" type="password" inputmode="numeric" autocomplete="off"></label>
        <button class="btn primary" id="admSrv"><span data-i="admServer"></span></button>
        <button class="btn" id="admPl"><span data-i="admPlayers"></span></button>
      </div>
      <ul class="alist" id="admPlayers" style="margin-top:10px"></ul>
    </div>
    <h2 class="ah" data-i="admCells"></h2>
    <ul class="alist" id="admCells"></ul>
    <h2 class="ah" data-i="admCCells"></h2>
    <ul class="alist" id="admCCells"></ul>
    <h2 class="ah" data-i="admPath"></h2>
    <ul class="alist" id="admPath"></ul>
    <div class="row">
      <button class="btn" id="admReset"><span data-i="admReset"></span></button>
      <button class="btn" id="admProg"><span data-i="admProg"></span></button>
    </div>

let PL=store.get("player",null);
if(!PL||!PL.id){PL={id:(crypto.randomUUID?crypto.randomUUID():rhex(4)+"-"+rhex(2)+"-4"+rhex(2).slice(1)+"-a"+rhex(2).slice(1)+"-"+rhex(6)),token:rhex(24),nick:"",grupo:""};store.set("player",PL)}
const TOT=store.get("tot",{h:0,t:0,b:0});
function totHit(ok){TOT.t++;if(ok)TOT.h++;TOT.b=Math.max(TOT.b,...Object.values(S.sc).map(c=>c.k));store.set("tot",TOT);queueSync()}
const stagesDone=()=>CFG.path.filter((s,i)=>doneOf(i)).length;
let syncT=null;
function queueSync(){clearTimeout(syncT);syncT=setTimeout(syncNow,1500)}
async function syncNow(){
  if(!PL.nick||PL.nick.length<2)return false;
  try{return await rpc("ofino_save",{p_id:PL.id,p_token:PL.token,p_nick:PL.nick,p_grupo:PL.grupo,p_stages:stagesDone(),p_hits:TOT.h,p_tries:TOT.t,p_best:TOT.b,p_progress:P.prog})}
  catch(e){return false}}
let rkScope=store.get("rkScope","g");
async function renderRank(){
  segSet("rkScope",rkScope);const L=$("rkList");
  const g=rkScope==="g"?PL.grupo:"";
  try{const rows=await rpc("ofino_ranking",{p_grupo:g,p_limit:20})||[];
    L.innerHTML=rows.length?rows.map((r,i)=>{const me=r.nick===PL.nick&&r.grupo===PL.grupo;
      return `<li class="${me?"me":""}"><span class="pos">${i+1}</span><span class="nm">${esc(r.nick)} <span class="gr">${esc(r.grupo)}</span></span><span class="sc">${r.stages} ${t().stagesS} · ${r.hits} ${t().hitsS}</span></li>`}).join(""):`<li>${t().noRank}</li>`}
  catch(e){L.innerHTML=`<li>${t().offline}</li>`}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
function fillProfile(){$("pNick").value=PL.nick||"";$("pGrupo").value=PL.grupo||""}
$("pSave").onclick=async()=>{
  const n=$("pNick").value.trim().slice(0,20),g=$("pGrupo").value.trim().toUpperCase().slice(0,20);
  if(n.length<2){$("pMsg").textContent=t().nickShort;return}
  PL.nick=n;PL.grupo=g;store.set("player",PL);
  const ok=await syncNow();$("pMsg").textContent=ok?t().saved:t().offline;$("pMsg").className="fb"+(ok?" ok":"");renderRank()};
$("rkScope").onclick=e=>{const b=e.target.closest("button");if(!b)return;rkScope=b.dataset.v;store.set("rkScope",rkScope);renderRank()};
/* configuración do servidor */
async function loadServerCfg(){
  try{const c=await rpc("ofino_get_config");if(validCfg(c)){CFG=normCfg(c);saveCfg();
    if(!$("ridBox").hidden)newId();if(!$("secP").hidden)renderPath();if(!$("secA").hidden)renderAdmin()}}catch(e){}}
$("admSrv").onclick=async()=>{try{const ok=await rpc("ofino_set_config",{p_pin:$("admPin").value,p_data:CFG});admMsg(ok?"saved":"admPinBad")}catch(e){admMsg("offline")}};
async function renderPlayers(){
  try{const rows=await rpc("ofino_admin_players",{p_pin:$("admPin").value})||[];
    if(!rows.length){$("admPlayers").innerHTML=`<li>${t().noRank} / ${t().admPinBad}</li>`;return}
    $("admPlayers").innerHTML=rows.map(r=>`<li><span class="lab"><b>${esc(r.nick)}</b> · ${esc(r.grupo)} · ${r.stages} ${t().stagesS} · ${r.hits} ${t().hitsS}</span><button data-del="${r.id}" aria-label="✕">✕</button></li>`).join("")}
  catch(e){$("admPlayers").innerHTML=`<li>${t().offline}</li>`}}
$("admPl").onclick=renderPlayers;
$("admPlayers").onclick=async e=>{const b=e.target.closest("[data-del]");if(!b)return;
  if(!b.dataset.armed){b.dataset.armed="1";b.textContent=t().sure;return}
  try{await rpc("ofino_admin_delete",{p_pin:$("admPin").value,p_id:b.dataset.del})}catch(e){}renderPlayers()};
function checkAdminHash(){if(location.hash==="#admin")$("gearTab").hidden=false}
window.addEventListener("hashchange",checkAdminHash);

/* ================= XERAL ================= */
function applyLang(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=t()[el.dataset.i]});
  document.title=t().app;
  $("langCur").innerHTML=FLAGS[S.lang];
  $("langMenu").innerHTML=LANGS.filter(l=>l!==S.lang).map(l=>`<button data-lang="${l}" aria-label="${l}">${FLAGS[l]}</button>`).join("");
  hints();if(typeof lvLabel==="function")lvLabel();
  if(!playing){$("status").textContent=t().ready;mStatus(M.phase==="idle"?"melReady":M.mode==="live"?"liveEnd":"memWrite")}
  if(S.checked)$("fb").textContent=cmp(S.user,S.target).every(Boolean)?t().ok:t().bad;
  if(M.checked){const n=total(),g=M.target.filter((m,i)=>M.user[i]===m).length;$("mfb").textContent=g===n?t().ok:fmt(t().partial,{a:g,b:n})}
}
function setSec(s,keep){stopAll();if(!keep&&P.active!==null)exitPath(true);S.sec=s;store.set("sec",s);segSetTabs();
  ["p","r","m","a"].forEach(x=>$("sec"+x.toUpperCase()).hidden=s!==x);
  if(s==="p"){renderPath();fillProfile();renderRank()}if(s==="a")renderAdmin()}
function segSetTabs(){document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.sec===S.sec)))}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b)setSec(b.dataset.sec)};
$("langCur").onclick=e=>{e.stopPropagation();$("lang").classList.toggle("open")};
$("langMenu").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.lang=b.dataset.lang;store.set("lang",S.lang);$("lang").classList.remove("open");applyLang()};
document.addEventListener("click",()=>$("lang").classList.remove("open"));
$("levels").onclick=e=>{const b=e.target.closest("button");if(b)setLevel(+b.dataset.l)};
$("play").onclick=()=>playR(S.target);
$("mine").onclick=()=>playR(S.user);
$("check").onclick=check;
$("next").onclick=newEx;
$("clear").onclick=()=>{S.user=blank();edited()};
$("showSol").onclick=()=>{$("solbox").hidden=false;draw($("sol"),S.target)};
$("bpm").value=S.bpm;$("bpmOut").textContent=S.bpm;
$("bpm").oninput=e=>{S.bpm=+e.target.value;$("bpmOut").textContent=S.bpm;store.set("bpm",S.bpm)};
$("pulse").checked=S.pulse;
$("figs").checked=S.figs;
$("figs").onchange=e=>{S.figs=e.target.checked;store.set("figs",S.figs);render();if(!$("solbox").hidden)draw($("sol"),S.target)};
$("pulse").onchange=e=>{S.pulse=e.target.checked;store.set("pulse",S.pulse)};

segSet("mcount",M.count);segSet("mheads",M.heads);
setLevel([1,2,3,4].includes(S.level)?S.level:1);
if(!(M.level>=1&&M.level<=8))M.level=1;$("mlv").value=M.level;buildKeys();
setMMode(["live","err"].includes(M.mode)?M.mode:"mem");
{const al0=applyLang;applyLang=function(){al0();if(!$("ridBox").hidden)renderId();if(!$("rbBox").hidden){renderB();if(!B.checked)$("bstatus").textContent=bHintNow()}if(!$("secP").hidden)renderPath();if(!$("secA").hidden)renderAdmin();if(!$("secP").hidden)renderRank();pathBar()}}
checkAdminHash();loadServerCfg();
$("timbre").value=S.timbre;$("timbre").onchange=e=>{S.timbre=e.target.value;store.set("timbre",S.timbre);tone(ac().currentTime+.03,.5,523.25)};
S.rmode=store.get("rmode","pre");setRMode(["id","build","err"].includes(S.rmode)?S.rmode:"pre");
setSec(["p","r","m"].includes(S.sec)?S.sec:"r");if(location.hash==="#admin")setSec("a");
applyLang();
</script>
</body>
